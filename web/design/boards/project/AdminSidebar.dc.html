<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wedlock admin — Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Manrope:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<aside style="font-family: 'Manrope', system-ui, sans-serif; width: 256px; min-height: 1000px; height: 100%; box-sizing: border-box; background: #23271F; color: #BFC5B6; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px">
<a href="AdminDashboard.dc.html" style="text-decoration: none; color: #F6F4EE; display: flex; align-items: center; gap: 10px; padding: 0 8px">
<svg width="30" height="30" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="13" cy="17" r="9"></circle><circle cx="21" cy="17" r="9"></circle></svg>
<span style="display: flex; flex-direction: column; line-height: 1"><span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase">Wedlock</span><span style="font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: #C9AE7E; margin-top: 5px; font-weight: 600">Admin</span></span>
</a>
<nav aria-label="Admin" style="display: flex; flex-direction: column; gap: 18px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #8E9784; font-weight: 600; padding: 0 8px 6px">{{g.name}}</span>
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
<a href="{{i.href}}" style="text-decoration: none; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 4px; font-size: 14px; color: {{i.fg}}; background: {{i.bg}}; border-left: 2px solid {{i.line}}">{{i.label}}<span style="font-size: 11px; color: #C9AE7E">{{i.badge}}</span></a>
</sc-for>
</div>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #3E4438; padding-top: 16px">
<a href="Home.dc.html" style="color: #BFC5B6; font-size: 13px; padding: 0 8px">View website ↗</a>
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<img src="/_blob/71e5a6152f8bbc4fa72dd3ad80990678" alt="" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: 50% 15%">
<span style="display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 13px; color: #F6F4EE">Syed Aabish Hassan</span><span style="font-size: 11px; color: #8E9784">Admin (owner)</span></span>
</div>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","leads","events","vendors","messages","journal","stories","media","content","packages","users"],"default":"dashboard"},"$preview":{"width":256,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'dashboard';
const groups = [
{ name: 'Overview', items: [{ key: 'dashboard', label: 'Dashboard', href: 'AdminDashboard.dc.html', badge: '' }] },
{ name: 'Business', items: [
{ key: 'leads', label: 'Leads', href: 'AdminLeads.dc.html', badge: '6 new' },
{ key: 'events', label: 'Events', href: 'AdminEvents.dc.html', badge: '' },
{ key: 'vendors', label: 'Vendors', href: 'AdminVendors.dc.html', badge: '2' },
{ key: 'messages', label: 'Messages', href: 'AdminMessages.dc.html', badge: '' }
] },
{ name: 'Website', items: [
{ key: 'stories', label: 'Couple stories', href: 'AdminStoryEditor.dc.html', badge: '' },
{ key: 'journal', label: 'Journal', href: 'AdminJournalEditor.dc.html', badge: '' },
{ key: 'media', label: 'Media library', href: 'AdminMedia.dc.html', badge: '' },
{ key: 'content', label: 'Site content', href: 'AdminSiteContent.dc.html', badge: '' },
{ key: 'packages', label: 'Packages & add-ons', href: 'AdminPackages.dc.html', badge: '' }
] },
{ name: 'Settings', items: [{ key: 'users', label: 'Users & roles', href: 'AdminUsers.dc.html', badge: '' }] }
];
return { groups: groups.map((g) => ({ ...g, items: g.items.map((i) => ({ ...i, bg: i.key === active ? '#2E3328' : 'transparent', fg: i.key === active ? '#F6F4EE' : '#BFC5B6', line: i.key === active ? '#B8975F' : 'transparent' })) })) };
}
}
</script>
</body>
</html>
